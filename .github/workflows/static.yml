# Deploy static site to GitHub Pages
# Fetches free Patreon posts at deploy time (CORS blocks browser fetch).
name: Deploy static content to Pages

on:
 push:
 branches: ["main"]
 workflow_dispatch:
 # Refresh free posts weekly even without a code push
 schedule:
 - cron: "0 14 * * 1"

permissions:
 contents: read
 pages: write
 id-token: write

concurrency:
 group: "pages"
 cancel-in-progress: false

jobs:
 deploy:
 environment:
 name: github-pages
 url: ${{ steps.deployment.outputs.page_url }}
 runs-on: ubuntu-latest
 steps:
 - name: Checkout
 uses: actions/checkout@v4

 - name: Setup Node
 uses: actions/setup-node@v4
 with:
 node-version: "20"

 - name: Fetch free Patreon posts
 run: node scripts/fetch-patreon-posts.mjs
 continue-on-error: true

 - name: Setup Pages
 uses: actions/configure-pages@v5

 - name: Upload artifact
 uses: actions/upload-pages-artifact@v3
 with:
 path: "."

 - name: Deploy to GitHub Pages
 id: deployment
 uses: actions/deploy-pages@v4
